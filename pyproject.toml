[project]
name = "mojo-freetype-py"
version = "0.1.0"
description = "Glyph outline rasterization in Mojo with a freetype-py-compatible API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "freetype-py>=2.5"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
